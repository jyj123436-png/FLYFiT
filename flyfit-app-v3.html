<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FLYFiT App</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#AAED3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FLYFiT">
<link rel="apple-touch-icon" href="/flyfit-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --lime:#AAED3F; --lime-dark:#8FCC2A; --lime-dim:rgba(170,237,63,0.15);
    --black:#080808; --card:#181818; --card2:#202020;
    --text:#F0F0F0; --muted:#666; --border:rgba(170,237,63,0.13);
    --safe:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--black); color:var(--text); font-family:'Noto Sans JP',sans-serif; font-weight:300; overscroll-behavior:none; }
  .shell { max-width:390px; height:100vh; margin:0 auto; display:flex; flex-direction:column; position:relative; overflow:hidden; background:var(--black); }
  .status-bar { display:flex; justify-content:space-between; align-items:center; padding:14px 24px 6px; font-size:.72rem; font-weight:700; flex-shrink:0; }
  .screen { display:none; flex-direction:column; overflow:hidden; position:absolute; inset:0; top:44px; bottom:0; }
  .screen.active { display:flex; }

  /* LOGIN */
  #screen-login { background:var(--black); justify-content:flex-end; padding:0 0 40px; }
  .login-bg { position:absolute; inset:0; overflow:hidden; }
  .login-bg-glow { position:absolute; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle,rgba(170,237,63,.22) 0%,transparent 70%); top:-80px; left:50%; transform:translateX(-50%); animation:pulse 4s ease-in-out infinite; }
  .login-bg-lines { position:absolute; inset:0; background-image:repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(170,237,63,.04) 38px,rgba(170,237,63,.04) 39px); }
  @keyframes pulse { 0%,100%{opacity:.7;transform:translateX(-50%) scale(1)} 50%{opacity:1;transform:translateX(-50%) scale(1.08)} }
  .login-logo-wrap { position:absolute; top:80px; left:0; right:0; text-align:center; }
  .login-logo { font-family:'Bebas Neue',sans-serif; font-size:4rem; letter-spacing:.1em; color:var(--lime); text-shadow:0 0 40px rgba(170,237,63,.5); line-height:1; }
  .login-tagline { font-size:.72rem; letter-spacing:.35em; color:var(--muted); margin-top:6px; text-transform:uppercase; }
  .login-form-wrap { position:relative; z-index:2; padding:0 28px; }
  .form-group { margin-bottom:14px; }
  .form-label { font-size:.68rem; letter-spacing:.15em; color:var(--muted); text-transform:uppercase; margin-bottom:6px; display:block; }
  .form-input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; color:var(--text); font-size:.9rem; font-family:'Noto Sans JP',sans-serif; outline:none; }
  .form-input::placeholder { color:var(--muted); }
  .btn-login { width:100%; background:var(--lime); color:var(--black); border:none; border-radius:14px; padding:16px; font-size:1rem; font-weight:900; font-family:'Noto Sans JP',sans-serif; letter-spacing:.1em; cursor:pointer; margin-top:8px; box-shadow:0 8px 32px rgba(170,237,63,.3); }
  .btn-login:disabled { opacity:.5; }
  .error-msg { background:rgba(255,80,80,.12); border:1px solid rgba(255,80,80,.3); border-radius:10px; padding:10px 14px; font-size:.78rem; color:#ff8080; margin-bottom:12px; display:none; }
  .loading-msg { text-align:center; font-size:.75rem; color:var(--lime); margin-top:10px; display:none; }

  /* HOME */
  #screen-home { background:var(--black); overflow-y:auto; padding-bottom:calc(70px + var(--safe)); }
  .home-header { padding:20px 24px 0; display:flex; align-items:center; justify-content:space-between; }
  .home-greeting { font-size:.75rem; color:var(--muted); }
  .home-name { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; letter-spacing:.05em; line-height:1; }
  .home-name span { color:var(--lime); }
  .notif-btn { width:42px; height:42px; border-radius:12px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; position:relative; }
  .notif-dot { position:absolute; top:8px; right:8px; width:8px; height:8px; background:var(--lime); border-radius:50%; border:2px solid var(--black); display:none; }

  /* Schedule card */
  .schedule-card { margin:18px 24px 0; background:linear-gradient(135deg,#1a2a00,#0f1a00); border:1px solid rgba(170,237,63,.25); border-radius:20px; padding:24px; position:relative; overflow:hidden; }
  .schedule-card::before { content:''; position:absolute; right:-20px; top:-20px; width:120px; height:120px; background:radial-gradient(circle,rgba(170,237,63,.25),transparent 70%); border-radius:50%; }
  .sc-label { font-size:.65rem; letter-spacing:.2em; color:var(--lime); text-transform:uppercase; margin-bottom:10px; }
  .sc-day { font-family:'Bebas Neue',sans-serif; font-size:2.2rem; color:var(--text); letter-spacing:.05em; line-height:1; margin-bottom:12px; }
  .sc-classes { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .sc-class { background:rgba(170,237,63,.15); border:1px solid rgba(170,237,63,.25); border-radius:20px; padding:5px 12px; font-size:.75rem; color:var(--lime); font-weight:700; }
  .sc-notice { background:rgba(170,237,63,.08); border:1px solid rgba(170,237,63,.15); border-radius:12px; padding:12px; }
  .sc-notice-row { display:flex; align-items:center; gap:8px; font-size:.75rem; color:var(--muted); line-height:1.5; }
  .sc-notice-row + .sc-notice-row { margin-top:6px; }
  .sc-notice-icon { font-size:1rem; flex-shrink:0; }

  /* News */
  .section-head { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 10px; }
  .section-title { font-size:.8rem; font-weight:700; }
  .unread-badge { background:var(--lime); color:var(--black); font-size:.6rem; font-weight:900; padding:2px 7px; border-radius:20px; display:none; }
  .news-scroll { display:flex; flex-direction:column; gap:10px; padding:0 24px; }
  .news-item { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; gap:14px; align-items:flex-start; cursor:pointer; position:relative; overflow:hidden; }
  .news-item.unread::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--lime); border-radius:16px 0 0 16px; }
  .news-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
  .ni-green{background:var(--lime-dim)} .ni-blue{background:rgba(91,230,255,.1)} .ni-orange{background:rgba(255,169,77,.1)} .ni-purple{background:rgba(204,93,232,.1)} .ni-red{background:rgba(255,80,80,.1)}
  .news-content { flex:1; min-width:0; }
  .news-tag-sm { font-size:.6rem; color:var(--lime); letter-spacing:.12em; text-transform:uppercase; margin-bottom:4px; }
  .news-title-sm { font-size:.84rem; font-weight:700; line-height:1.35; }
  .news-date-sm { font-size:.65rem; color:var(--muted); margin-top:4px; }
  .news-empty { text-align:center; padding:40px 24px; color:var(--muted); font-size:.85rem; }
  .news-loading { text-align:center; padding:30px; color:var(--muted); font-size:.8rem; }

  /* DETAIL */
  #screen-detail { background:var(--black); overflow-y:auto; padding-bottom:40px; }
  .detail-header { padding:16px 24px; display:flex; align-items:center; gap:12px; flex-shrink:0; border-bottom:1px solid var(--border); }
  .back-btn { width:36px; height:36px; border-radius:10px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer; flex-shrink:0; }
  .detail-body { padding:24px; }
  .detail-tag { font-size:.65rem; color:var(--lime); letter-spacing:.15em; text-transform:uppercase; margin-bottom:10px; }
  .detail-title { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:.04em; line-height:1.1; margin-bottom:14px; }
  .detail-meta { font-size:.72rem; color:var(--muted); margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .detail-text { font-size:.88rem; line-height:1.9; color:rgba(240,240,240,.85); white-space:pre-wrap; }

  /* MYPAGE */
  #screen-mypage { background:var(--black); overflow-y:auto; padding-bottom:calc(70px + var(--safe)); }
  .mypage-header { padding:20px 24px 0; }
  .mypage-title { font-family:'Bebas Neue',sans-serif; font-size:1.9rem; letter-spacing:.05em; }
  .mypage-card { margin:18px 24px 0; background:linear-gradient(135deg,var(--lime-dark),var(--lime)); border-radius:20px; padding:22px; color:var(--black); position:relative; overflow:hidden; }
  .mypage-card::after { content:'FLYFiT'; position:absolute; right:-10px; bottom:-16px; font-family:'Bebas Neue',sans-serif; font-size:5rem; opacity:.12; }
  .mp-name { font-size:1.1rem; font-weight:900; margin-bottom:2px; }
  .mp-email { font-size:.72rem; opacity:.7; margin-bottom:14px; }
  .mp-plan { font-size:.7rem; font-weight:700; letter-spacing:.1em; background:rgba(0,0,0,.15); display:inline-block; padding:4px 10px; border-radius:20px; }
  .menu-list { padding:20px 24px 0; display:flex; flex-direction:column; gap:10px; }
  .menu-item { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; }
  .menu-icon { font-size:1.2rem; width:28px; text-align:center; }
  .menu-label { font-size:.88rem; flex:1; }
  .menu-arrow { color:var(--muted); }
  .logout-btn { margin:20px 24px 0; width:calc(100% - 48px); background:none; border:1px solid rgba(255,80,80,.3); border-radius:14px; padding:14px; color:#ff6b6b; font-size:.88rem; font-family:'Noto Sans JP',sans-serif; cursor:pointer; }

  /* NOTIF BANNER */
  #notif-banner { position:fixed; top:60px; left:50%; transform:translateX(-50%); width:calc(100% - 32px); max-width:358px; background:linear-gradient(135deg,#1a2a00,#0f1a00); border:1px solid rgba(170,237,63,.4); border-radius:16px; padding:14px 16px; display:none; align-items:center; gap:12px; z-index:200; box-shadow:0 8px 32px rgba(0,0,0,.5); }
  .notif-banner-text { flex:1; font-size:.78rem; line-height:1.5; color:var(--text); }
  .notif-banner-text strong { color:var(--lime); display:block; margin-bottom:2px; }
  .btn-notif-allow { background:var(--lime); color:var(--black); border:none; border-radius:10px; padding:8px 14px; font-size:.75rem; font-weight:900; font-family:'Noto Sans JP',sans-serif; cursor:pointer; white-space:nowrap; }
  .btn-notif-close { color:var(--muted); font-size:1.2rem; cursor:pointer; background:none; border:none; flex-shrink:0; }

  /* INSTALL BANNER */
  .install-banner { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); width:calc(100% - 48px); max-width:342px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 16px; display:none; align-items:center; gap:12px; z-index:100; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  .install-icon { width:40px; height:40px; border-radius:10px; overflow:hidden; flex-shrink:0; }
  .install-icon img { width:100%; height:100%; object-fit:cover; }
  .install-text { flex:1; }
  .install-title { font-size:.82rem; font-weight:700; margin-bottom:2px; }
  .install-sub { font-size:.68rem; color:var(--muted); }
  .install-btn { background:var(--lime); color:var(--black); border:none; border-radius:10px; padding:8px 14px; font-size:.75rem; font-weight:900; font-family:'Noto Sans JP',sans-serif; cursor:pointer; white-space:nowrap; }
  .install-close { color:var(--muted); font-size:1.2rem; cursor:pointer; flex-shrink:0; background:none; border:none; }
  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:390px; background:rgba(10,10,10,.95); backdrop-filter:blur(20px); border-top:1px solid var(--border); display:none; padding:8px 0 calc(8px + var(--safe)); z-index:50; }
  .bottom-nav.visible { display:flex; }
  .nav-tabs { display:flex; width:100%; }
  .nav-tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; cursor:pointer; }
  .nav-tab .tab-icon { font-size:1.3rem; }
  .nav-tab .tab-label { font-size:.6rem; color:var(--muted); }
  .nav-tab.active .tab-label { color:var(--lime); }
  .nav-tab.active .tab-icon { filter:drop-shadow(0 0 6px rgba(170,237,63,.6)); }
</style>
</head>
<body>
<div class="shell">
  <div class="status-bar">
    <span id="status-time">9:41</span>
    <div style="display:flex;gap:6px">📶 🔋</div>
  </div>

  <!-- NOTIF BANNER -->
  <div id="notif-banner">
    <div class="notif-banner-text"><strong>🔔 通知を有効にする</strong>お知らせをプッシュ通知で受け取れます</div>
    <button class="btn-notif-allow" onclick="registerPushToken()">許可する</button>
    <button class="btn-notif-close" onclick="document.getElementById('notif-banner').style.display='none'">×</button>
  </div>

  <!-- LOGIN -->
  <div class="screen active" id="screen-login">
    <div class="login-bg"><div class="login-bg-glow"></div><div class="login-bg-lines"></div></div>
    <div class="login-logo-wrap"><div class="login-logo">FLYFiT</div><div class="login-tagline">Members Only</div></div>
    <div class="login-form-wrap">
      <div class="error-msg" id="error-msg"></div>
      <div class="form-group"><label class="form-label">メールアドレス</label><input class="form-input" type="email" id="input-email" placeholder="example@email.com"></div>
      <div class="form-group"><label class="form-label">パスワード</label><input class="form-input" type="password" id="input-pass" placeholder="••••••••"></div>
      <button class="btn-login" id="btn-login" onclick="tryLogin()">ログイン</button>
      <div class="loading-msg" id="loading-msg">ログイン中...</div>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen" id="screen-home">
    <div class="home-header">
      <div><div class="home-greeting">おかえりなさい 👋</div><div class="home-name" id="home-name">会員 <span>さん</span></div></div>
      <div class="notif-btn" onclick="switchTab('news')">🔔<div class="notif-dot" id="notif-dot"></div></div>
    </div>

    <!-- Schedule card -->
    <div class="schedule-card">
      <div class="sc-label">📅 レッスンスケジュール</div>
      <div class="sc-day">毎週 水曜日</div>
      <div class="sc-classes">
        <span class="sc-class">💪 ボディコンバット</span>
        <span class="sc-class">🧘 ボディバランス</span>
      </div>
      <div class="sc-notice">
        <div class="sc-notice-row"><span class="sc-notice-icon">🕗</span><span>開始時間・終了時間はお知らせでご確認ください</span></div>
        <div class="sc-notice-row"><span class="sc-notice-icon">📍</span><span>開催場所もお知らせでご案内します</span></div>
      </div>
    </div>

    <!-- News -->
    <div class="section-head">
      <span class="section-title">最新のお知らせ</span>
      <span class="unread-badge" id="unread-badge"></span>
    </div>
    <div class="news-scroll" id="news-list"><div class="news-loading">読み込み中...</div></div>
  </div>

  <!-- DETAIL -->
  <div class="screen" id="screen-detail">
    <div class="detail-header">
      <div class="back-btn" onclick="goBack()">←</div>
      <span style="font-size:.82rem;color:var(--muted)">お知らせ詳細</span>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>

  <!-- MYPAGE -->
  <div class="screen" id="screen-mypage">
    <div class="mypage-header"><div class="mypage-title">マイページ</div></div>
    <div class="mypage-card">
      <div class="mp-name" id="mp-name">会員</div>
      <div class="mp-email" id="mp-email"></div>
      <div class="mp-plan">◆ FLYFiT会員</div>
    </div>
    <div class="menu-list">
      <div class="menu-item"><span class="menu-icon">📢</span><span class="menu-label">お知らせ一覧</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">📅</span><span class="menu-label">レッスンスケジュール</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">📞</span><span class="menu-label">お問い合わせ</span><span class="menu-arrow">›</span></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">ログアウト</button>
  </div>

  <!-- INSTALL BANNER -->
  <div class="install-banner" id="install-banner">
    <div class="install-icon"><img src="/flyfit-icon.png" alt="FLYFiT"></div>
    <div class="install-text">
      <div class="install-title">FLYFiT をインストール</div>
      <div class="install-sub">ホーム画面に追加してアプリとして使う</div>
    </div>
    <button class="install-btn" id="install-btn">追加</button>
    <button class="install-close" id="install-close">×</button>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav" id="bottom-nav">
    <div class="nav-tabs">
      <div class="nav-tab active" id="tab-home" onclick="switchTab('home')"><span class="tab-icon">🏠</span><span class="tab-label">ホーム</span></div>
      <div class="nav-tab" id="tab-news" onclick="switchTab('news')"><span class="tab-icon">📢</span><span class="tab-label">お知らせ</span></div>
      <div class="nav-tab" id="tab-mypage" onclick="switchTab('mypage')"><span class="tab-icon">👤</span><span class="tab-label">マイページ</span></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyDC1sYaLfwWt8KyMnacZI6PN_m13bNUm78",
    authDomain: "flyfit-5a273.firebaseapp.com",
    projectId: "flyfit-5a273",
    storageBucket: "flyfit-5a273.firebasestorage.app",
    messagingSenderId: "917291626568",
    appId: "1:917291626568:web:a4d040141f594c01fb287d"
  });

  var auth = firebase.auth();
  var db = firebase.firestore();
  var newsCache = [];
  var unsubNews = null;
  var prevScreen = 'home';
  var currentUserId = null;

  // FCMトークンを取得してFirestoreに保存（ボタン押下時に呼ぶ）
  function registerPushToken() {
    if (!currentUserId) return;
    if (!('Notification' in window)) {
      alert('このブラウザは通知に対応していません');
      return;
    }
    Notification.requestPermission().then(function(permission) {
      if (permission !== 'granted') {
        alert('通知が許可されませんでした。設定から許可してください。');
        return;
      }
      // Service Workerを使ってFCMトークン取得
      navigator.serviceWorker.ready.then(function(reg) {
        var VAPID = 'BO3FSMkgR5daNN2MNTdojBdDpTcFNoiLRy1CZqfPT-Ti5NQXEcbj7eLCHr71yjnmdbXhVppAKz5p_Suw2bxVGOs';
        return reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID)
        });
      }).then(function(sub) {
        var token = btoa(JSON.stringify(sub));
        db.collection('fcmTokens').doc(currentUserId).set({
          token: JSON.stringify(sub),
          endpoint: sub.endpoint,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('notif-banner').style.display = 'none';
        alert('🔔 通知を有効にしました！');
      }).catch(function(err) {
        console.log('通知登録エラー:', err);
        alert('通知の設定に失敗しました: ' + err.message);
      });
    });
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = window.atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  var tagIcons = {'重要':'📢','イベント':'🏆','新着':'👋','お知らせ':'📋','キャンペーン':'🎁','場所・時間':'📍'};
  var tagColors = {'重要':'ni-green','イベント':'ni-blue','新着':'ni-purple','お知らせ':'ni-orange','キャンペーン':'ni-red','場所・時間':'ni-green'};

  function updateTime() {
    var n = new Date();
    document.getElementById('status-time').textContent = ('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
  }
  updateTime(); setInterval(updateTime, 10000);

  auth.onAuthStateChanged(function(user) {
    if (user) {
      var email = user.email || '';
      var name = email.split('@')[0].toUpperCase();
      document.getElementById('home-name').innerHTML = name + ' <span>さん</span>';
      document.getElementById('mp-name').textContent = name;
      document.getElementById('mp-email').textContent = email;
      showScreen('home');
      document.getElementById('bottom-nav').classList.add('visible');
      startNewsListener();
      currentUserId = user.uid;
      // 通知が未許可なら通知バナーを表示
      if ('Notification' in window && Notification.permission === 'default') {
        document.getElementById('notif-banner').style.display = 'flex';
      }
    } else {
      if (unsubNews) { unsubNews(); unsubNews = null; }
      showScreen('login');
      document.getElementById('bottom-nav').classList.remove('visible');
    }
  });

  function startNewsListener() {
    unsubNews = db.collection('news').orderBy('createdAt','desc').onSnapshot(function(snap) {
      newsCache = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderNews(newsCache);
    }, function(err) {
      document.getElementById('news-list').innerHTML = '<div class="news-empty">読み込みエラーが発生しました</div>';
    });
  }

  function renderNews(items) {
    var list = document.getElementById('news-list');
    if (!items.length) {
      list.innerHTML = '<div class="news-empty">まだお知らせはありません</div>';
      document.getElementById('unread-badge').style.display = 'none';
      document.getElementById('notif-dot').style.display = 'none';
      return;
    }
    var readIds = JSON.parse(localStorage.getItem('readNews')||'[]');
    var unread = items.filter(function(i){ return readIds.indexOf(i.id)===-1; }).length;
    if (unread > 0) {
      var badge = document.getElementById('unread-badge');
      badge.textContent = unread+'件 未読';
      badge.style.display = 'inline';
      document.getElementById('notif-dot').style.display = 'block';
    } else {
      document.getElementById('unread-badge').style.display = 'none';
      document.getElementById('notif-dot').style.display = 'none';
    }
    list.innerHTML = items.map(function(item) {
      var icon = tagIcons[item.tag] || '📋';
      var color = tagColors[item.tag] || 'ni-orange';
      var isUnread = readIds.indexOf(item.id)===-1;
      var date = item.createdAt ? item.createdAt.toDate().toLocaleDateString('ja-JP') : '';
      return '<div class="news-item'+(isUnread?' unread':'')+'" onclick="openNews(\''+item.id+'\')">'+
        '<div class="news-icon '+color+'">'+icon+'</div>'+
        '<div class="news-content">'+
        '<div class="news-tag-sm">'+(item.tag||'')+'</div>'+
        '<div class="news-title-sm">'+(item.title||'')+'</div>'+
        '<div class="news-date-sm">'+date+'</div>'+
        '</div></div>';
    }).join('');
  }

  function openNews(id) {
    var item = null;
    for (var i=0;i<newsCache.length;i++) { if(newsCache[i].id===id){item=newsCache[i];break;} }
    if (!item) return;
    var readIds = JSON.parse(localStorage.getItem('readNews')||'[]');
    if (readIds.indexOf(id)===-1) { readIds.push(id); localStorage.setItem('readNews',JSON.stringify(readIds)); }
    var date = item.createdAt ? item.createdAt.toDate().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}) : '';
    var icon = tagIcons[item.tag] || '📋';
    document.getElementById('detail-body').innerHTML =
      '<div class="detail-tag">'+icon+' '+(item.tag||'')+'</div>'+
      '<div class="detail-title">'+(item.title||'')+'</div>'+
      '<div class="detail-meta">📅 '+date+' · FLYFiT事務局</div>'+
      '<div class="detail-text">'+(item.body||'')+'</div>';
    prevScreen = 'home';
    showScreen('detail');
    renderNews(newsCache);
  }

  function tryLogin() {
    var email = document.getElementById('input-email').value.trim();
    var pass = document.getElementById('input-pass').value;
    var errEl = document.getElementById('error-msg');
    var btn = document.getElementById('btn-login');
    var loadEl = document.getElementById('loading-msg');
    if (!email || !pass) { errEl.textContent='メールアドレスとパスワードを入力してください'; errEl.style.display='block'; return; }
    errEl.style.display='none'; btn.disabled=true; loadEl.style.display='block';
    auth.signInWithEmailAndPassword(email,pass).catch(function(e){
      var msg='ログインエラー: '+e.code;
      if(e.code==='auth/wrong-password'||e.code==='auth/user-not-found'||e.code==='auth/invalid-credential') msg='メールアドレスまたはパスワードが違います';
      else if(e.code==='auth/invalid-email') msg='メールアドレスの形式が正しくありません';
      else if(e.code==='auth/too-many-requests') msg='試行回数が多すぎます。しばらく後にお試しください';
      errEl.textContent=msg; errEl.style.display='block';
      btn.disabled=false; loadEl.style.display='none';
    });
  }

  function doLogout() {
    auth.signOut();
    document.getElementById('input-email').value='';
    document.getElementById('input-pass').value='';
    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active');});
    document.getElementById('tab-home').classList.add('active');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
    document.getElementById('screen-'+id).classList.add('active');
  }

  function switchTab(tab) {
    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active');});
    var tabEl = document.getElementById('tab-'+tab);
    if (tabEl) tabEl.classList.add('active');
    showScreen(tab==='news' ? 'home' : tab);
    if (tab==='news') { setTimeout(function(){ document.getElementById('screen-home').scrollTop=400; }, 50); }
    prevScreen = tab==='mypage' ? 'mypage' : 'home';
  }

  function goBack() { showScreen(prevScreen||'home'); }
  document.getElementById('input-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') tryLogin(); });

  // PWA: Service Worker登録
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(err){ console.log('SW error:', err); });
  }

  // PWA: ホーム画面追加プロンプト
  var deferredPrompt;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('install-banner').style.display = 'flex';
  });

  document.getElementById('install-btn') && document.getElementById('install-btn').addEventListener('click', function() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function() {
        deferredPrompt = null;
        document.getElementById('install-banner').style.display = 'none';
      });
    }
  });

  document.getElementById('install-close') && document.getElementById('install-close').addEventListener('click', function() {
    document.getElementById('install-banner').style.display = 'none';
  });
</script>
</body>
</html>
